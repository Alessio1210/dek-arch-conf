# Profil: Leise Leistung — Ryzen 5 5600 + RTX 3060 Ti
#
# Gilt für die zwei durch pwmconfig bestätigten Ausgänge: pwm2 -> fan2
# (Tachosignal) und pwm3 -> Lüftergruppe ohne Tachosignal. Die anderen
# Header bleiben im Mainboard-Automatikmodus. Beide Gruppen folgen Tctl.
#
# pwm2 läuft im Leerlauf bei rund 1.000 RPM und erreicht 100 % bei 78 °C.
# pwm3 läuft ab 27 %, damit die daran angeschlossene Lüftergruppe sicher
# anläuft, und erreicht 100 % bei 75 °C.
INTERVAL=10
DEVPATH=hwmon1=devices/pci0000:00/0000:00:18.3 hwmon2=devices/platform/nct6775.656
DEVNAME=hwmon1=k10temp hwmon2=nct6793
FCTEMPS=hwmon2/pwm2=hwmon1/temp1_input hwmon2/pwm3=hwmon1/temp1_input
FCFANS=hwmon2/pwm2=hwmon2/fan2_input
MINTEMP=hwmon2/pwm2=42 hwmon2/pwm3=38
MAXTEMP=hwmon2/pwm2=78 hwmon2/pwm3=75
MINSTART=hwmon2/pwm2=80 hwmon2/pwm3=100
MINSTOP=hwmon2/pwm2=10 hwmon2/pwm3=70
MINPWM=hwmon2/pwm2=10 hwmon2/pwm3=70
MAXPWM=hwmon2/pwm2=255 hwmon2/pwm3=255
AVERAGE=hwmon2/pwm2=3 hwmon2/pwm3=5
