background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.72
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(255, 255, 255, 0.96)
    font_size = 86
    font_family = JetBrainsMono Nerd Font Propo
    position = 0, 140
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(143, 154, 163, 0.92)
    font_size = 18
    font_family = JetBrainsMono Nerd Font Propo
    position = 0, 72
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "Hi, $USER"
    color = rgba(255, 255, 255, 0.96)
    font_size = 20
    font_family = JetBrainsMono Nerd Font Propo
    position = 0, -70
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 54
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.28
    dots_center = true
    outer_color = rgba(100, 114, 125, 0.55)
    inner_color = rgba(5, 5, 5, 0.72)
    font_color = rgba(255, 255, 255, 0.96)
    fade_on_empty = false
    placeholder_text = <span foreground="##8f9aa3">Password</span>
    hide_input = false
    check_color = rgba(38, 166, 91, 0.95)
    fail_color = rgba(235, 77, 75, 0.95)
    fail_text = <i>Try again</i>
    capslock_color = rgba(241, 196, 15, 0.95)
    rounding = 8
    position = 0, -132
    halign = center
    valign = center
}
