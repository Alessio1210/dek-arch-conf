# hyprlock.conf
# docs: https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock

$font = Roboto Mono
source = ~/.config/hypr/hyprlock-colors.conf

$np     = ~/.config/hypr/scripts/now-playing.sh
$player = ~/.config/hypr/scripts/now-playing.sh control

general {
    hide_cursor = false
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 1.5, linear
    animation = fadeOut, 1, 1.5, linear
    animation = inputFieldDots, 1, 1, linear
}

background {
    monitor =
    # Capture the current desktop each time Hyprlock starts.
    path = screenshot
    blur_passes = 2
    blur_size = 7
}


# PROFILE PICTURE
image {
    monitor =
    path = ~/.config/hypr/scripts/pfp3.png
    size = 140
    rounding = -1
    border_size = 2
    border_color = $lock_outline
    position = 0, 130
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 3
    inner_color = rgba(0, 0, 0, 0.0)
    outer_color = $lock_outline
    check_color = $lock_check
    fail_color = $lock_fail
    font_color = $lock_font
    font_family = $font
    fade_on_empty = false
    rounding = 25
    placeholder_text =
    fail_text = $PAMFAIL$FPRINTFAIL
    dots_size = 0.3
    dots_spacing = 0.3
    position = 0, 0
    halign = center
    valign = center
}

# TIME
label {
    monitor =
    text = $TIME
    font_size = 60
    font_family = $font
    color = $lock_time
    position = 0, -130
    halign = center
    valign = top
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    font_size = 16
    font_family = $font
    color = $lock_date
    position = 0, -250
    halign = center
    valign = top
}

# KEYBOARD LAYOUT
label {
    monitor =
    text = $LAYOUT[de]
    font_size = 14
    font_family = $font
    color = $lock_layout
    onclick = hyprctl switchxkblayout all next
    position = 0, -70
    halign = center
    valign = center
}

# NOW PLAYING (marquee)
label {
    monitor =
    text = cmd[update:400] $np
    font_size = 15
    font_family = $font
    color = $lock_date
    position = 0, -300
    halign = center
    valign = center
}

# MEDIA CONTROLS: same size, same y, evenly spaced, just below the marquee
label {
    monitor =
    text = cmd[update:1000] $np previous
    font_size = 18
    font_family = $font
    color = $lock_date
    onclick = $player previous
    position = -50, -345
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] $np pause
    font_size = 18
    font_family = $font
    color = $lock_date
    onclick = $player play-pause
    position = 0, -345
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] $np next
    font_size = 18
    font_family = $font
    color = $lock_date
    onclick = $player next
    position = 50, -345
    halign = center
    valign = center
}
